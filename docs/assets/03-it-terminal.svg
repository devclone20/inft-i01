  <text x="915" y="222" text-anchor="middle" fill="#8b949e" font-size="12" transform="rotate(90 915 222)">your assistant, awake</text>
  <text x="944" y="222" text-anchor="middle" fill="#566070" font-size="11" transform="rotate(90 944 222)">name · iNFT · Pi</text>
