<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
  <defs>
    <linearGradient id="violine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b18bf5" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#b18bf5" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="420" rx="14" fill="#0d1117"/>
  <rect x="1.5" y="1.5" width="1097" height="417" rx="13" fill="none" stroke="#30363d" stroke-width="3"/>
  <rect x="0" y="412" width="1100" height="4" fill="url(#violine)" opacity="0.9"/>

  <circle cx="28" cy="26" r="6" fill="#ff5f57"/>
  <circle cx="50" cy="26" r="6" fill="#febc2e"/>
  <circle cx="72" cy="26" r="6" fill="#28c840"/>
  <g stroke="#b18bf5" fill="none" stroke-linecap="round">
    <rect x="101" y="15.5" width="20" height="17" rx="6" stroke-width="1.6" stroke-dasharray="3 2.5"/>
    <line x1="111" y1="15.5" x2="111" y2="11.5" stroke-width="1.6"/>
    <circle cx="111" cy="10" r="1.6" stroke-width="1.2"/>
    <circle cx="106.8" cy="22" r="1.7" stroke-width="1.2"/>
    <circle cx="115.2" cy="22" r="1.7" stroke-width="1.2"/>
    <path d="M107 27 Q111 30 115 27" stroke-width="1.4" stroke-dasharray="2.5 2"/>
  </g>
  <text x="550" y="31" text-anchor="middle" font-size="13" fill="#8b949e">open it by name in the CLONE FRAME iT terminal</text>

  <g font-size="12">
    <rect x="120" y="80" width="560" height="74" rx="10" fill="#161b22" stroke="#c9d1d9" stroke-width="2"/>
    <text x="142" y="110" fill="#e6edf3" font-weight="bold" font-size="14">YOU — iT terminal</text>
    <text x="142" y="136" fill="#8b949e">type the agent's name:  <tspan fill="#c48b96">iclone</tspan></text>

    <rect x="120" y="192" width="560" height="74" rx="10" fill="#161b22" stroke="#b18bf5" stroke-width="2"/>
    <text x="142" y="222" fill="#b18bf5" font-weight="bold" font-size="14">LAUNCHER</text>
    <text x="142" y="248" fill="#8b949e">~/.clone-frame-hub/bin/&lt;name&gt;</text>

    <rect x="120" y="304" width="560" height="74" rx="10" fill="#161b22" stroke="#c48b96" stroke-width="2"/>
    <text x="142" y="334" fill="#c48b96" font-weight="bold" font-size="14">Pi — in your agent repo</text>
    <text x="142" y="360" fill="#8b949e">cd agent-repo &amp;&amp; pi -a</text>
  </g>

  <g stroke="#566070" stroke-width="2" fill="none">
    <path d="M400 154 400 186"/><path d="M394 180 400 188 406 180"/>
    <path d="M400 266 400 298"/><path d="M394 292 400 300 406 292"/>
  </g>

  <!-- return -->
  <path d="M680 341 C900 341 900 117 688 117" fill="none" stroke="#c48b96" stroke-width="2" stroke-dasharray="6 5"/>
