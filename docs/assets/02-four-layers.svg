<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
  <defs>
    <linearGradient id="violine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b18bf5" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#b18bf5" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="480" rx="14" fill="#0d1117"/>
  <rect x="1.5" y="1.5" width="997" height="477" rx="13" fill="none" stroke="#30363d" stroke-width="3"/>
  <rect x="0" y="472" width="1000" height="4" fill="url(#violine)" opacity="0.9"/>

  <circle cx="28" cy="26" r="6" fill="#ff5f57"/>
  <circle cx="50" cy="26" r="6" fill="#febc2e"/>
  <circle cx="72" cy="26" r="6" fill="#28c840"/>
  <g stroke="#b18bf5" fill="none" stroke-linecap="round">
    <rect x="101" y="15.5" width="20" height="17" rx="6" stroke-width="1.6" stroke-dasharray="3 2.5"/>
    <line x1="111" y1="15.5" x2="111" y2="11.5" stroke-width="1.6"/>
    <circle cx="111" cy="10" r="1.6" stroke-width="1.2"/>
    <circle cx="106.8" cy="22" r="1.7" stroke-width="1.2"/>
    <circle cx="115.2" cy="22" r="1.7" stroke-width="1.2"/>
    <path d="M107 27 Q111 30 115 27" stroke-width="1.4" stroke-dasharray="2.5 2"/>
  </g>
  <text x="500" y="31" text-anchor="middle" font-size="13" fill="#8b949e">one agent, four layers — a name on top, Pi underneath</text>

  <g font-size="13">
    <rect x="120" y="66" width="760" height="74" rx="8" fill="#161b22" stroke="#b18bf5" stroke-width="2"/>
    <text x="140" y="96"><tspan fill="#b18bf5" font-weight="bold">NAME — the face</tspan></text>
    <text x="140" y="120" fill="#8b949e">your marketplace name · iclone · pi</text>

    <rect x="150" y="164" width="700" height="74" rx="8" fill="#161b22" stroke="#9fe016" stroke-width="2"/>
    <text x="170" y="194"><tspan fill="#9fe016" font-weight="bold">SOUL — the identity</tspan></text>
    <text x="170" y="218" fill="#8b949e">iCLONE neural soul — four lobes · immutable laws</text>

    <rect x="180" y="262" width="640" height="74" rx="8" fill="#161b22" stroke="#6ea8ff" stroke-width="2"/>
    <text x="200" y="292"><tspan fill="#6ea8ff" font-weight="bold">Pi — the substrate</tspan></text>
    <text x="200" y="316" fill="#8b949e">full Pi coding agent (MIT) + skills + tools</text>

    <rect x="210" y="360" width="580" height="74" rx="8" fill="#161b22" stroke="#5ed3d8" stroke-width="2"/>
    <text x="230" y="390"><tspan fill="#5ed3d8" font-weight="bold">KEY — the mind (BYOK)</tspan></text>
    <text x="230" y="414" fill="#8b949e">your model: cloud API or local MATRIX cluster</text>
  </g>

  <text x="935" y="250" text-anchor="middle" fill="#566070" font-size="11" transform="rotate(90 935 250)">the token proves who owns the whole stack</text>
</svg>
