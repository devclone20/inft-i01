<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
  <defs>
    <linearGradient id="violine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b18bf5" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#b18bf5" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="400" rx="14" fill="#0d1117"/>
  <rect x="1.5" y="1.5" width="1097" height="397" rx="13" fill="none" stroke="#30363d" stroke-width="3"/>
  <rect x="0" y="392" width="1100" height="4" fill="url(#violine)" opacity="0.9"/>

  <circle cx="28" cy="26" r="6" fill="#ff5f57"/>
  <circle cx="50" cy="26" r="6" fill="#febc2e"/>
  <circle cx="72" cy="26" r="6" fill="#28c840"/>
  <g stroke="#b18bf5" fill="none" stroke-linecap="round">
    <rect x="101" y="15.5" width="20" height="17" rx="6" stroke-width="1.6" stroke-dasharray="3 2.5"/>
    <line x1="111" y1="15.5" x2="111" y2="11.5" stroke-width="1.6"/>
    <circle cx="111" cy="10" r="1.6" stroke-width="1.2"/>
    <circle cx="106.8" cy="22" r="1.7" stroke-width="1.2"/>
    <circle cx="115.2" cy="22" r="1.7" stroke-width="1.2"/>
    <path d="M107 27 Q111 30 115 27" stroke-width="1.4" stroke-dasharray="2.5 2"/>
  </g>
  <text x="550" y="31" text-anchor="middle" font-size="13" fill="#8b949e">where everything lives — four houses, never all on-chain</text>

  <g font-size="12">
    <rect x="40" y="100" width="220" height="140" rx="10" fill="#161b22" stroke="#6ea8ff" stroke-width="2"/>
    <text x="60" y="130" fill="#6ea8ff" font-weight="bold">CHAIN</text>
    <text x="60" y="150" fill="#8b949e" font-size="11">the catalog</text>
    <text x="60" y="180" fill="#c9d1d9">token = who owns</text>
    <text x="60" y="200" fill="#c9d1d9">the agent</text>

    <rect x="300" y="100" width="220" height="140" rx="10" fill="#161b22" stroke="#5ed3d8" stroke-width="2"/>
    <text x="320" y="130" fill="#5ed3d8" font-weight="bold">IRYS / ARWEAVE</text>
    <text x="320" y="150" fill="#8b949e" font-size="11">the archive</text>
    <text x="320" y="180" fill="#c9d1d9">sealed genesis +</text>
    <text x="320" y="200" fill="#c9d1d9">content hashes</text>

    <rect x="560" y="100" width="220" height="140" rx="10" fill="#161b22" stroke="#b18bf5" stroke-width="2"/>
    <text x="580" y="130" fill="#b18bf5" font-weight="bold">GITHUB</text>
    <text x="580" y="150" fill="#8b949e" font-size="11">the workshop</text>
    <text x="580" y="180" fill="#c9d1d9">the monorepo,</text>
    <text x="580" y="200" fill="#c9d1d9">per commit</text>

    <rect x="820" y="100" width="220" height="140" rx="10" fill="#161b22" stroke="#9fe016" stroke-width="2"/>
    <text x="840" y="130" fill="#9fe016" font-weight="bold">RUNTIME</text>
    <text x="840" y="150" fill="#8b949e" font-size="11">the vault</text>
    <text x="840" y="180" fill="#c9d1d9">keys + private memory</text>
    <text x="840" y="200" fill="#c9d1d9">encrypted · local only</text>
  </g>

  <g stroke="#566070" stroke-width="2" stroke-dasharray="5 4" fill="none">
    <path d="M260 170 292 170"/>
    <path d="M520 170 552 170"/>
    <path d="M780 170 812 170"/>
  </g>
  <g stroke="#566070" stroke-width="2" fill="none">
    <path d="M286 164 294 170 286 176"/>
    <path d="M546 164 554 170 546 176"/>
    <path d="M806 164 814 170 806 176"/>
  </g>

  <text x="550" y="300" text-anchor="middle" fill="#8b949e" font-size="13">the chain points to Irys · Irys anchors the workshop · the workshop feeds the vault</text>
  <text x="550" y="336" text-anchor="middle" fill="#566070" font-size="12">the token is a catalog card, not the agent — secrets never leave the owner's machine</text>
</svg>
